[project]
dependencies = [
    "gradio>=6.16.0",
    "inference-gpu[yolo-world]>=0.30.0",
    "onnxsim>=0.4.36",
    "ruff>=0.11.2",
    "segment-anything>=1.0",
    "supervision>=0.22.0",
    "timm>=1.0.15",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
description = "Add your description here"
name = "yolo-world-efficientvit-sam"
